# Aktualisiert am 29.07.2026: zeigt jetzt auf notaqfguhhjpvmagvcic ("Lernecke"), das seit dem
# Kontowechsel produktiv genutzte Projekt. Vorheriger Eintrag zeigte auf das alte Projekt
# ybzdibifgqjsbohtztmy (ZAP_25) und war seit dem Kontowechsel nicht mehr gültig, siehe
# docs/migration-evidence/2026-07-29-baseline-adoption-decision.md. Host per Supabase-Konvention
# aws-0-<region>.pooler.supabase.com aus region=eu-west-1 abgeleitet, NICHT gegen das Dashboard
# verifiziert -- vor erster Nutzung unter "Connect" gegenprüfen.
#
# Rollenname zap_baseline_reader_lernecke statt zap_baseline_reader: Der Kontowechsel hat einen
# gleichnamigen, abgelaufenen zap_baseline_reader-Datensatz mitübernommen, den die
# Dashboard-SQL-Editor-Sitzung (Rolle postgres, hat CREATEROLE aber kein ADMIN OPTION auf diesen
# konkreten, nicht selbst erzeugten Datensatz -- PostgreSQL-16+-Modell) weder ändern noch
# vermutlich löschen kann. Neuer, eindeutiger Name statt Kampf gegen dieses Eigentümerproblem.
[zap_baseline_readonly]
host=aws-0-eu-west-1.pooler.supabase.com
port=5432
dbname=postgres
user=zap_baseline_reader_lernecke.notaqfguhhjpvmagvcic
sslmode=verify-full
connect_timeout=10
application_name=zap_baseline_readonly
